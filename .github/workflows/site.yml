# 내용(content/)이나 디자인(templates/, static/)이 바뀌면 사이트를 다시 만들고 공개 전 검사를 합니다.
# - 모든 브랜치·관리자 수정 요청(PR): 검사 결과가 ✓/✗ 로 표시됩니다.
# - main: 검사를 통과하면 site/ 폴더를 다시 만들어 저장합니다 (GitHub Pages·미리보기 링크용).
#   Cloudflare Pages를 연결한 뒤에는 Cloudflare가 직접 만들어 공개하므로 이 저장 단계는 지워도 됩니다.
name: 사이트 빌드와 검사

on:
  push:
    branches: ['**']
    paths-ignore: ['site/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: 사이트 만들기 + 공개 전 검사
        env:
          ATINC_PRIVATE_WORDS: ${{ secrets.ATINC_PRIVATE_WORDS }}
        run: python3 tools/build.py --check
      - name: site/ 저장 (main 만)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "atInc site bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A site
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "사이트 다시 만들기 (${GITHUB_SHA::7})"
          git push
