<head>

<title>atInc 사진 후보</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 사진 후보 고르기 (임시 페이지, 고른 뒤 지웁니다). 색은 사이트와 같은 캐시미어 & 코코아 */
  :root { --bg: #F4EEE6; --paper: #FBF8F4; --line: #E2D5C4; --ink: #2F231C; --body: #56473C; --sub: #64544A; --cocoa: #6E4C37; --camel: #E4D3BD; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.7 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; letter-spacing: -.01em; }
  .page { max-width: 1240px; margin: 0 auto; padding: clamp(28px, 5vw, 64px) clamp(16px, 4vw, 48px) 96px; }
  h1 { margin: 0 0 12px; font-size: clamp(26px, 3vw, 36px); line-height: 1.3; letter-spacing: -.03em; }
  .intro { max-width: 64ch; margin: 0 0 8px; color: var(--body); }
  .how { display: grid; gap: 4px; margin: 18px 0 40px; padding: 16px 18px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; color: var(--body); font-size: 14.5px; }
  .how b { color: var(--ink); }
  .slot { padding-block: 32px; border-top: 1px solid var(--line); }
  .slot h2 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
  .slot p { margin: 4px 0 18px; color: var(--sub); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
  figure { margin: 0; display: grid; gap: 8px; align-content: start; min-width: 0; }
  .ph { position: relative; display: block; aspect-ratio: 4 / 3; overflow: hidden; border-radius: 6px; background: var(--camel); }
  .ph img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .ph .no { position: absolute; left: 8px; top: 8px; min-width: 30px; padding: 3px 9px; border-radius: 999px; background: rgba(251, 248, 244, .94); color: var(--ink); font-size: 13px; font-weight: 700; text-align: center; }
  .ph .err { position: absolute; inset: 0; display: grid; place-items: center; padding: 12px; color: var(--sub); font-size: 13px; text-align: center; }
  .cur .ph { outline: 2px solid var(--cocoa); outline-offset: 2px; }
  .cur .no { background: var(--cocoa); color: #fff; }
  figcaption { font-size: 13.5px; line-height: 1.5; color: var(--body); }
  @media (max-width: 1000px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 600px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<main class="page">
  <h1>사진 후보</h1>
  <p class="intro">차갑거나 의료 장면이 강한 사진 10곳의 후보입니다. 기준은 세 가지입니다. 사람 얼굴, 간판·글자, 시술 장면은 없습니다. 병원 시설을 자랑하는 화려한 사진은 뺐습니다. 캐시미어 & 코코아에 맞는 따뜻하고 차분한 톤으로 골랐습니다.</p>
  <div class="how">
    <span><b>고르는 법</b>: 자리마다 번호 하나씩 알려 주세요. 예) "건강검진 첫 화면 2, 한방 사진 띠 1"</span>
    <span><b>지금</b> 표시가 현재 사진입니다. 지금 사진을 그대로 두려면 "0"이라고 하시면 됩니다.</span>
    <span>사진을 누르면 크게 보입니다. 같은 사진은 한 곳에만 씁니다. 모두 무료 사진(Unsplash)입니다.</span>
  </div>
  <div id="slots"></div>
</main>

  function url(id, w) { return 'https://images.unsplash.com/photo-' + id + '?auto=format&fit=crop&w=' + w + '&q=70'; }
  function fig(id, text, no, cur) {
    return '<figure class="' + (cur ? 'cur' : '') + '"><a class="ph" href="' + url(id, 1800) + '" target="_blank" rel="noopener">' +
      '<img src="' + url(id, 640) + '" alt="' + text + '" loading="lazy" onerror="this.remove();this.parentNode.insertAdjacentHTML(\'beforeend\',\'<span class=err>이 사진은 불러오지 못했습니다</span>\')">' +
      '<span class="no">' + (cur ? '지금' : no) + '</span></a><figcaption>' + text + '</figcaption></figure>';
  }
  document.getElementById('slots').innerHTML = SLOTS.map(function (s) {
    return '<section class="slot"><h2>' + s[0] + '</h2><p>' + s[1] + '</p><div class="grid">' + fig(s[2][0], s[2][1], 0, true) +
      s[3].map(function (c, i) { return fig(c[0], c[1], i + 1, false); }).join('') + '</div></section>';
