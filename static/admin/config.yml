# 자동으로 만들어지는 파일입니다. tools/admin_config.py 를 고친 뒤 다시 실행하세요.
app_title: atInc 홈페이지 관리
backend:
  name: github
  repo: atinc629-baaaam/atInc.co.kr2
  branch: main
  cms_label_prefix: cms/
  commit_messages:
    create: '관리자: {{collection}} 「{{slug}}」 추가'
    update: '관리자: {{collection}} 「{{slug}}」 수정'
    delete: '관리자: {{collection}} 「{{slug}}」 삭제'
    uploadMedia: '관리자: 사진 올림 {{path}}'
    deleteMedia: '관리자: 사진 지움 {{path}}'
publish_mode: simple
media_folder: static/uploads
public_folder: /uploads
site_url: https://atinc.co.kr
output:
  omit_empty_optional_fields: true
slug:
  encoding: ascii
  clean_accents: true
collections:
- name: settings
  label: 사이트 설정
  editor:
    preview: false
  files:
  - name: settings
    label: 사이트 설정 (연락처·회사 정보·메뉴·바닥글·상담 카드)
    file: content/settings.yml
    fields:
    - label: 사이트
      name: site
      widget: object
      required: false
      collapsed: true
      fields:
      - label: 브랜드 표기
        name: name
        widget: string
        required: false
      - label: 사이트 주소
        name: url
        widget: string
        required: false
      - label: 휴대폰 주소창 색
        name: theme_color
        widget: string
        required: false
      - label: 검색엔진용 회사 소개 한 줄
        name: org_description
        widget: text
        required: false
      - label: 휴대폰에서 줄이 바뀌면 안 되는 말
        name: keep_together
        widget: list
        required: false
        field:
          label: 항목
          name: item
          widget: string
          required: false
        hint: '띄어쓰기 그대로 적습니다. 예: 한 곳만'
    - label: 연락처
      name: contact
      widget: object
      required: false
      collapsed: true
      fields:
      - label: 이메일
        name: email
        widget: string
        required: false
      - label: 전화 (화면 표기)
        name: phone
        widget: string
        required: false
      - label: 전화 (+82로 시작, 띄어쓰기 없이)
        name: phone_tel
        widget: string
        required: false
      - label: 전화 (해외 표기)
        name: phone_intl
        widget: string
        required: false
      - label: 전화 (검색엔진용)
        name: phone_schema
        widget: string
        required: false
      - label: 상담 신청서 주소 (구글 폼)
        name: form_url
        widget: string
        required: false
      - label: 제휴 문의 메일 주소 (mailto:)
        name: partner_mail
        widget: string
        required: false
    - label: 회사 정보
      name: company
      widget: object
      required: false
      collapsed: true
      fields:
      - label: 법인명
        name: legal_name
        widget: string
        required: false
      - label: 대표
        name: ceo
        widget: string
        required: false
      - label: 사업자등록번호
        name: biz_no
        widget: string
        required: false
      - label: 외국인환자 유치업 등록번호
        name: tourism_no
        widget: string
        required: false
      - label: 주소
        name: address
        widget: string
        required: false
        hint: 정해지면 적습니다. 바닥글·회사소개·고지에 나옵니다.
    - label: 메뉴 이름
      name: nav
      widget: object
      required: false
      collapsed: true
      fields:
      - label: 본문 바로가기
        name: skip
        widget: string
        required: false
      - label: 회사소개
        name: about
        widget: string
        required: false
      - label: 진료 분야
        name: medical
        widget: string
        required: false
      - label: 케어 프로그램
        name: care
        widget: string
        required: false
      - label: 협력 네트워크
        name: network
        widget: string
        required: false
      - label: 제휴 안내
        name: partners
        widget: string
        required: false
      - label: 상담 안내
        name: consultation
        widget: string
        required: false
      - label: 개인정보처리방침
        name: privacy
        widget: string
        required: false
      - label: 의료서비스 관련 고지
        name: notice
        widget: string
        required: false
      - label: 상담 예약 버튼
        name: cta
        widget: string
        required: false
      - label: 오른쪽 떠 있는 전화 버튼
        name: fab_call
        widget: string
        required: false
      - label: 맨 위로 버튼
        name: fab_top
        widget: string
        required: false
      - label: 휴대폰 아래 전화 버튼
        name: mbar_call
        widget: string
        required: false
    - label: 바닥글
      name: footer
      widget: object
      required: false
      collapsed: true
      fields:
      - label: 한 줄
        name: tagline
        widget: string
        required: false
      - label: 영문 한 줄
        name: sub
        widget: string
        required: false
      - label: 고지 문장
        name: notice
        widget: text
        required: false
      - label: 저작권 표기
        name: copyright
        widget: string
        required: false
    - label: 상담 예약 카드
      name: appt
      widget: object
      required: false
      collapsed: true
      fields:
      - label: 카드 제목
        name: title
        widget: string
        required: false
      - label: 안내 줄
        name: rows
        widget: list
        required: false
        fields:
        - label: 항목
          name: k
          widget: string
          required: false
        - label: 내용
          name: v
          widget: text
          required: false
        collapsed: true
        summary: '{{fields.k}}'
      - label: 버튼 아래 작은 글
        name: form_note
        widget: string
        required: false
      - label: 전화 앞 글자
        name: line_label
        widget: string
        required: false
      - label: 해외 안내 (영문)
        name: intl_en
        widget: string
        required: false
      - label: 해외 안내 (중문)
        name: intl_zh
        widget: string
        required: false
    - label: 상담 띠 기본값
      name: cband
      widget: object
      required: false
      collapsed: true
      fields:
      - label: 작은 영문 머리글
        name: label
        widget: string
        required: false
      - label: 기본 안내 줄
        name: promises
        widget: list
        required: false
        field:
          label: 항목
          name: item
          widget: text
          required: false
- name: pages
  label: 페이지
  label_singular: 페이지
  editor:
    preview: false
  files:
  - name: home
    label: 홈
    file: content/pages/home.yml
    preview_path: ''
    fields:
    - label: 검색 결과에 보이는 글
      name: seo
      widget: object
      required: false
      collapsed: true
      fields:
      - label: 페이지 제목 (브라우저 탭)
        name: title
        widget: string
        required: false
      - label: 페이지 설명 (검색 결과 아래 글)
        name: description
        widget: text
        required: false
    - label: 섹션 (위에서부터 화면 순서)
      name: sections
      widget: list
      types:
      - name: hero_slider
        label: 첫 화면 슬라이드
        widget: object
        fields:
        - label: 이 섹션 숨기기
          name: hidden
          widget: boolean
          required: false
          default: false
          hint: 켜면 화면에서 빠집니다. 지우지 않고 잠시 내릴 때 씁니다.
        - label: 화면 낭독용 제목
          name: sr_title
          widget: string
          required: false
          hint: 화면에는 보이지 않고 검색엔진과 화면 낭독기에 쓰입니다.
        - label: 슬라이드
          name: slides
          widget: list
          required: false
          fields:
          - label: 사진
            name: photo
            widget: object
            required: true
            collapsed: false
            fields:
            - label: 사진 파일
              name: src
              widget: image
              required: true
              hint: 사람 얼굴, 간판·로고, 수술·피 장면은 쓰지 않습니다. 협력 병원 실제 사진은 병원 허락을 받은 것만 씁니다.
            - label: 사진 설명
              name: alt
              widget: string
              required: false
              hint: 무엇이 보이는 사진인지 짧게 적습니다. 화면 낭독기와 검색에 쓰입니다.
            - label: 사진 초점 위치
              name: pos
              widget: string
              required: false
              hint: 사진이 잘릴 때 남길 곳. 가로% 세로% — 가운데 50% 50%, 위쪽 50% 25%, 아래쪽 50% 75%
          - label: 작은 영문 머리글
            name: label
            widget: string
            required: false
          - label: 큰 제목
            name: title
            widget: text
            required: false
            hint: 줄을 바꾸면 화면에서도 그 자리에서 줄이 바뀝니다.
          - label: 설명
            name: text
            widget: text
            required: false
          - label: 버튼
            name: button
            widget: object
            required: false
            collapsed: false
            fields:
            - label: 버튼 글자
              name: label
              widget: string
              required: false
            - label: 상담 신청서로 연결
              name: form
              widget: boolean
              required: false
              default: false
              hint: 켜면 아래 주소 대신 상담 신청서(구글 폼)가 새 창으로 열립니다.
            - label: 신청서 관심 분야
              name: form_label
              widget: string
              required: false
              hint: '상담 신청서로 연결할 때 함께 넘길 분야 이름 (예: 건강검진)'
            - label: 연결 주소
              name: href
              widget: string
              required: false
              hint: '신청서 연결이 꺼져 있을 때 이동할 주소. 예: medical-checkup.html'
            - label: 버튼 모양
              name: style
              widget: select
              required: false
              options:
              - label: 밝은 버튼 (어두운 사진 위)
                value: btn btn--light
              - label: 테두리 버튼 (사진 위)
                value: btn btn--line
              - label: 진한 버튼
                value: btn btn--dark
              - label: 연한 테두리 버튼
                value: btn btn--ghost
              - label: 밑줄 글자
                value: link
            - label: 화살표 아이콘
              name: icon
              widget: select
              required: false
              options:
              - label: 바깥 화살표 표시
                value: out
          collapsed: true
          summary: '{{fields.label}}'
      - name: quick_menu
        label: 바로가기 메뉴
        widget: object
        fields:
        - label: 이 섹션 숨기기
          name: hidden
          widget: boolean
          required: false
          default: false
          hint: 켜면 화면에서 빠집니다. 지우지 않고 잠시 내릴 때 씁니다.
        - label: 메뉴
          name: items
          widget: list
          required: false
          fields:
          - label: 아이콘
            name: icon
            widget: select
            required: false
            options:
            - label: 진료(십자)
              value: medical
            - label: 달력
              value: calendar
            - label: 위치
              value: pin
            - label: 지구
              value: globe
            - label: 말풍선
              value: chat
            - label: 전화
              value: phone
          - label: 글자
            name: label
            widget: string
            required: false
          - label: 연결 주소
            name: href
            widget: string
            required: false
          collapsed: true
          summary: '{{fields.label}}'
      - name: marquee
        label: 흐르는 글자 띠
        widget: object
        fields:
        - label: 이 섹션 숨기기
          name: hidden
          widget: boolean
          required: false
          default: false
          hint: 켜면 화면에서 빠집니다. 지우지 않고 잠시 내릴 때 씁니다.
        - label: 흐르는 글자
          name: words
          widget: list
          required: false
          field:
            label: 항목
            name: item
            widget: string
            required: false
      - name: do_dont
        label: 하는 일 / 하지 않는 일
        widget: object
        fields:
        - label: 이 섹션 숨기기
          name: hidden
          widget: boolean
          required: false
          default: false
          hint: 켜면 화면에서 빠집니다. 지우지 않고 잠시 내릴 때 씁니다.
        - label: 작은 영문 머리글
          name: label
          widget: string
          required: false
          hint: '제목 위에 작게 들어가는 영문 (예: Medical)'
        - label: 제목
          name: title
          widget: string
          required: true
        - label: 제목 아래 설명
          name: lead
          widget: text
          required: false
        - label: 왼쪽 제목
          name: do_title
          widget: string
          required: false
        - label: 하는 일
          name: do
          widget: list
          required: false
          fields:
          - label: 항목
            name: k
            widget: string
            required: false
          - label: 설명
            name: d
            widget: text
            required: false
          collapsed: true
          summary: '{{fields.k}}'
        - label: 오른쪽 제목
          name: dont_title
          widget: string
          required: false
        - label: 하지 않는 일
          name: dont
          widget: list
          required: false
          field:
            label: 항목
            name: item
            widget: text
            required: false
        - label: 오른쪽 아래 작은 글
          name: note
          widget: string
          required: false
          hint: '예: 등록번호'
      - name: field_tiles
        label: 진료 분야 카드 (자동)
        widget: object
        fields:
        - label: 이 섹션 숨기기
          name: hidden
          widget: boolean
          required: false
          default: false
          hint: 카드는 [진료 분야] 메뉴의 내용으로 자동으로 만들어집니다. / 켜면 화면에서 빠집니다. 지우지 않고 잠시 내릴 때 씁니다.
        - label: 작은 영문 머리글
          name: label
          widget: string
          required: false
          hint: '제목 위에 작게 들어가는 영문 (예: Medical)'
        - label: 제목
          name: title
          widget: string
          required: true
        - label: 오른쪽 링크 (전체 보기 등)
          name: more
          widget: object
          required: false
          collapsed: false
          fields:
          - label: 글자
            name: label
            widget: string
            required: false
          - label: 연결 주소
            name: href
            widget: string
            required: false
            hint: '예: medical.html, network.html, #process'
        - label: 아래 한 줄 안내
          name: note
          widget: object
          required: false
          collapsed: false
          fields:
          - label: 앞 굵은 글
            name: label
            widget: string
            required: false
          - label: 문장
            name: text
            widget: text
            required: false
          - label: 링크 글자
            name: link_label
            widget: string
            required: false
          - label: 링크 주소
            name: link_href
            widget: string
            required: false
      - name: program_tiles
        label: 케어 프로그램 카드 (자동)
        widget: object
        fields:
        - label: 이 섹션 숨기기
          name: hidden
          widget: boolean
          required: false
          default: false
          hint: 카드는 [케어 프로그램] 메뉴의 내용으로 자동으로 만들어집니다. / 켜면 화면에서 빠집니다. 지우지 않고 잠시 내릴 때 씁니다.
        - label: 작은 영문 머리글
          name: label
          widget: string
          required: false
          hint: '제목 위에 작게 들어가는 영문 (예: Medical)'
        - label: 제목
          name: title
          widget: string
          required: true
        - label: 오른쪽 링크 (전체 보기 등)
          name: more
          widget: object
          required: false
          collapsed: false
          fields:
          - label: 글자
            name: label
            widget: string
            required: false
          - label: 연결 주소
            name: href
            widget: string
            required: false
            hint: '예: medical.html, network.html, #process'
      - name: flow
        label: 진행 단계 (홈)
        widget: object
        fields:
        - label: 이 섹션 숨기기
          name: hidden
          widget: boolean
          required: false
          default: false
          hint: 켜면 화면에서 빠집니다. 지우지 않고 잠시 내릴 때 씁니다.
        - label: 바로가기 이름
          name: anchor
          widget: string
          required: false
          hint: '다른 곳에서 #이름 으로 이 섹션에 바로 올 때 씁니다 (영문 소문자). 보통 비워 둡니다.'
        - label: 작은 영문 머리글
          name: label
          widget: string
          required: false
          hint: '제목 위에 작게 들어가는 영문 (예: Medical)'
        - label: 제목
          name: title
          widget: string
          required: true
        - label: 오른쪽 링크 (전체 보기 등)
          name: more
          widget: object
          required: false
          collapsed: false
          fields:
          - label: 글자
            name: label
            widget: string
            required: false
          - label: 연결 주소
            name: href
            widget: string
            required: false
            hint: '예: medical.html, network.html, #process'
        - label: 단계
          name: steps
          widget: list
          required: false
          fields:
          - label: 제목
            name: title
            widget: string
            required: false
          - label: 설명
            name: text
            widget: text
            required: false
          collapsed: true
          summary: '{{fields.title}}'
      - name: network_preview
        label: 전국 협력 의료기관 (지도)
        widget: object
        fields:
        - label: 이 섹션 숨기기
          name: hidden
          widget: boolean
          required: false
          default: false
          hint: 지도와 지역 목록은 [협력 지역] 메뉴의 내용으로 자동으로 만들어집니다. / 켜면 화면에서 빠집니다. 지우지 않고 잠시 내릴 때 씁니다.
        - label: 작은 영문 머리글
          name: label
          widget: string
          required: false
          hint: '제목 위에 작게 들어가는 영문 (예: Medical)'
        - label: 제목
          name: title
          widget: string
          required: true
        - label: 설명
          name: text
          widget: text
          required: false
          hint: '{regions} 라고 적은 자리에 지역 이름(서울, 인천 …)이 자동으로 들어갑니다.'
        - label: 선택한 분야에 지역이 없을 때 문장
          name: empty
          widget: text
          required: false
        - label: 아래 링크
          name: link
          widget: object
          required: false
          collapsed: false
          fields:
          - label: 글자
            name: label
            widget: string
            required: false
          - label: 연결 주소
            name: href
            widget: string
            required: false
            hint: '예: medical.html, network.html, #process'
        - label: 지도 아래 영문
          name: map_note_en
          widget: string
          required: false
        - label: 지도 아래 한글
          name: map_note
          widget: string
          required: false
      - name: intl
        label: 사진과 글 (좌우)
        widget: object
        fields:
        - label: 이 섹션 숨기기
          name: hidden
          widget: boolean
          required: false
          default: false
          hint: 켜면 화면에서 빠집니다. 지우지 않고 잠시 내릴 때 씁니다.
        - label: 사진
          name: photo
          widget: object
          required: false
