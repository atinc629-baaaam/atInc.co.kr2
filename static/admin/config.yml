- name: regions
  label: 협력 지역
  editor:
    preview: false
  files:
  - name: regions
    label: 협력 지역 (지도·지역 카드)
    file: content/regions.yml
    fields:
    - label: 지역
      name: regions
      widget: list
      required: false
      fields:
      - label: 지도 위치 (행정구역)
        name: area
        widget: string
        required: false
        hint: '지도에 점을 찍을 곳. 예: 서울 강남구, 경기 성남시 분당구. 화면에는 나오지 않습니다.'
      - label: 화면에 보이는 시·도
        name: name
        widget: string
        required: false
        hint: 시·도까지만. 구·동 이름과 병원 이름은 적지 않습니다.
      - label: 영문 시·도
        name: en
        widget: string
        required: false
      - label: 받을 수 있는 분야
        name: fields
        widget: relation
        collection: fields
        value_field: id
        search_fields:
        - ko
        display_fields:
        - ko
        multiple: true
        required: false
      - label: 지역 카드 한 줄
        name: note
        widget: text
        required: false
        hint: 받으실 수 있는 것만 적습니다. 장비·규모·인증·재단처럼 병원을 알아볼 수 있는 내용은 적지 않습니다.
      - label: 숨기기
        name: hidden
        widget: boolean
        required: false
        default: false
      collapsed: true
      summary: '{{fields.name}} · {{fields.area}}'
      hint: 같은 시·도의 설명은 한 카드에 모여서 보입니다.
