<p class="lead">사이트에 쓰는 임시 사진 20장입니다. 번호로 말씀해 주시면 바꾸겠습니다. (예: "04번 차 사진 교체, 공항 느낌으로")<br>바꿀 때 기준: 얼굴·간판·로고 없음, 밝고 따뜻한 자연광, 과하지 않은 고급스러움.</p>
<div class="grid"><figure><div class="ph"><img src="https://images.unsplash.com/photo-1546874177-9e664107314e?auto=format&fit=crop&w=900&q=75" alt="" loading="lazy"><span class="no">01</span></div><figcaption><b>hero-seoul</b><span>해 질 무렵 불이 켜진 서울 도심</span><em>메인</em></figcaption></figure><figure><div class="ph"><img src="https://images.unsplash.com/photo-1621293954908-907159247fc8?auto=format&fit=crop&w=900&q=75" alt="" loading="lazy"><span class="no">02</span></div><figcaption><b>hero-lounge</b><span>나무 벽과 소파가 놓인 조용한 라운지</span><em>메인</em></figcaption></figure><figure><div class="ph"><img src="https://images.unsplash.com/photo-1666214282459-c7dff167ecc0?auto=format&fit=crop&w=900&q=75" alt="" loading="lazy"><span class="no">03</span></div><figcaption><b>hero-equipment</b><span>비어 있는 영상 검사실의 장비</span><em>메인</em></figcaption></figure><figure><div class="ph"><img src="https://images.unsplash.com/photo-1770290405640-5daf7593c92a?auto=format&fit=crop&w=900&q=75" alt="" loading="lazy"><span class="no">04</span></div><figcaption><b>hero-arrival</b><span>검은 가죽 시트가 놓인 차량 뒷좌석</span><em>메인</em></figcaption></figure><figure><div class="ph"><img src="https://images.unsplash.com/photo-1666214280352-db292c05fd80?auto=format&fit=crop&w=900&q=75" alt="" loading="lazy"><span class="no">05</span></div><figcaption><b>cat-checkup</b><span>검사 테이블이 놓인 영상 검사실</span><em>메인 · 분야: checkup · 진료 분야 목록</em></figcaption></figure><figure><div class="ph"><img src="https://images.unsplash.com/photo-1748263582756-082fe4adaa5b?auto=format&fit=crop&w=900&q=75" alt="" loading="lazy"><span class="no">06</span></div><figcaption><b>cat-regenerative</b><span>랙에 나란히 꽂힌 검체 튜브</span><em>메인 · 분야: regenerative · 진료 분야 목록</em></figcaption></figure><figure><div class="ph"><img src="https://images.unsplash.com/photo-1787651343620-8d5303006ecb?auto=format&fit=crop&w=900&q=75" alt="" loading="lazy"><span class="no">07</span></div><figcaption><b>cat-aesthetic</b><span>베이지 시트가 덮인 관리실 베드</span><em>메인 · 분야: aesthetic · 진료 분야 목록</em></figcaption></figure><figure><div class="ph"><img src="https://images.unsplash.com/photo-1677000753622-03c5b7e987f8?auto=format&fit=crop&w=900&q=75" alt="" loading="lazy"><span class="no">08</span></div><figcaption><b>cat-women</b><span>햇빛이 비치는 리넨 커튼</span><em>메인 · 분야: women · 진료 분야 목록</em></figcaption></figure><figure><div class="ph"><img src="https://images.unsplash.com/photo-1507680434567-5739c80be1ac?auto=format&fit=crop&w=900&q=75" alt="" loading="lazy"><span class="no">09</span></div><figcaption><b>cat-men</b><span>셔츠 소매와 손목시계</span><em>메인 · 분야: men · 진료 분야 목록</em></figcaption></figure><figure><div class="ph"><img src="https://images.unsplash.com/photo-1545840716-c82e9eec6930?auto=format&fit=crop&w=900&q=75" alt="" loading="lazy"><span class="no">10</span></div><figcaption><b>cat-korean-medicine</b><span>말린 약재가 담긴 유리병과 놋그릇</span><em>메인 · 분야: korean-medicine · 진료 분야 목록</em></figcaption></figure><figure><div class="ph"><img src="https://images.unsplash.com/photo-1780571525506-67e3bb9ca947?auto=format&fit=crop&w=900&q=75" alt="" loading="lazy"><span class="no">11</span></div><figcaption><b>prog-private-checkup</b><span>고리에 걸린 흰 가운 두 벌</span><em>프로그램: private-checkup · 케어 프로그램 목록 · 메인</em></figcaption></figure><figure><div class="ph"><img src="https://images.unsplash.com/photo-1508963493744-76fce69379c0?auto=format&fit=crop&w=900&q=75" alt="" loading="lazy"><span class="no">12</span></div><figcaption><b>prog-longevity-90</b><span>바다를 바라보는 벤치</span><em>프로그램: longevity-90 · 케어 프로그램 목록 · 메인</em></figcaption></figure><figure><div class="ph"><img src="https://images.unsplash.com/photo-1764410481612-7544525b2991?auto=format&fit=crop&w=900&q=75" alt="" loading="lazy"><span class="no">13</span></div><figcaption><b>prog-executive-365</b><span>큰 창이 있는 집무실의 책상과 의자</span><em>프로그램: executive-365 · 케어 프로그램 목록 · 메인</em></figcaption></figure><figure><div class="ph"><img src="https://images.unsplash.com/photo-1729350038150-495c628bd695?auto=format&fit=crop&w=900&q=75" alt="" loading="lazy"><span class="no">14</span></div><figcaption><b>prog-global-medical-journey</b><span>해 질 무렵 비행기 창밖의 날개</span><em>프로그램: global-medical-journey · 케어 프로그램 목록 · 메인</em></figcaption></figure><figure><div class="ph"><img src="https://images.unsplash.com/photo-1786526818707-d28a60d7c21f?auto=format&fit=crop&w=900&q=75" alt="" loading="lazy"><span class="no">15</span></div><figcaption><b>global</b><span>도시 야경이 보이는 호텔 객실 창가</span><em>메인</em></figcaption></figure><figure><div class="ph"><img src="https://images.unsplash.com/photo-1787496994082-5e8cc6312408?auto=format&fit=crop&w=900&q=75" alt="" loading="lazy"><span class="no">16</span></div><figcaption><b>contact</b><span>창가의 크림색 안락의자와 찻잔</span><em>메인</em></figcaption></figure><figure><div class="ph"><img src="https://images.unsplash.com/photo-1512394005248-f047741d263e?auto=format&fit=crop&w=900&q=75" alt="" loading="lazy"><span class="no">17</span></div><figcaption><b>desk</b><span>안경과 찻잔이 놓인 책상</span><em>케어 프로그램 목록</em></figcaption></figure><figure><div class="ph"><img src="https://images.unsplash.com/photo-1642543492421-5a1f854e126c?auto=format&fit=crop&w=900&q=75" alt="" loading="lazy"><span class="no">18</span></div><figcaption><b>notes</b><span>찻잔 옆 노트에 메모하는 손</span><em>상담 안내</em></figcaption></figure><figure><div class="ph"><img src="https://images.unsplash.com/photo-1787496994867-939269b4d323?auto=format&fit=crop&w=900&q=75" alt="" loading="lazy"><span class="no">19</span></div><figcaption><b>hospital-space</b><span>그림이 걸린 밝은 클리닉 복도</span><em>제휴 안내</em></figcaption></figure><figure><div class="ph"><img src="https://images.unsplash.com/photo-1774953037913-af0cf688491a?auto=format&fit=crop&w=900&q=75" alt="" loading="lazy"><span class="no">20</span></div><figcaption><b>office</b><span>도시가 내다보이는 사무실 라운지와 회의실</span><em>회사소개</em></figcaption></figure></div></body></html>
