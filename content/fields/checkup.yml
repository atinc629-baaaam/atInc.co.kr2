- type: services
  anchor: services
  title: 협력 기관에서 받으실 수 있는 진료와 상담
  items:
  - title: 등급별 종합검진
    text: 기본부터 최상위까지 여러 단계의 코스
    sub:
    - 상위 코스는 초음파·CT·MRI·내시경이 더해집니다
    - CT·MRI 부위를 골라 받는 코스
    - 유전체 검사를 더한 코스
  - title: 연령·목적별 검진
    text: 나이와 목적에 맞춘 구성
    sub:
    - 2030 / 4050 / 6070 연령대별 검진
    - 예비부부 검진
    - 부모님(시니어) 검진
    - 국가건강검진(5대 암·생애전환기)·기업검진과 함께
    - 채용·유학생 검진
  - title: 분야별 정밀검진
    text: 관심 있는 분야를 깊게
    sub:
    - 여성 정밀
    - 혈액 정밀
    - 소화기 정밀
    - 뇌신경 정밀
    - 심장·폐·대장 특화, 돌연사 위험 요인 확인
  - title: 기본 검사
    text: 모든 코스의 바탕이 되는 검사
    sub:
    - 문진, 혈압·맥박, 신체계측, 체지방
    - 시력·청력, 안압·안저
    - 혈액·소변, 간·신장·당뇨·심혈관 수치
    - 흉부 X선, 심전도, 폐기능
    - 혈압맥파(스트레스·심박변이도) 검사
  - title: 초음파
    text: 방사선 없이 장기를 확인
    sub:
    - 복부(상·하복부)
    - 갑상선, 경동맥, 심장
    - 유방, 골반(여성)·전립선(남성)
  - title: 내시경
    text: 위와 대장을 직접 확인
    sub:
    - 위내시경 또는 위장조영
    - 대장내시경
    - 수면 내시경 선택
  - title: CT·MRI
    text: 부위를 골라 받는 정밀 영상
    sub:
    - 조영 복부 CT
    - 뇌·경추·요추·폐·심장·부비동 CT 가운데 선택
    - 뇌·경추·요추 MRI, 뇌혈관 MRA
    - 하루에 찍을 수 있는 CT 부위 수가 정해진 기관도 있습니다
  - title: 암·혈관·노화 검사
    text: 추가로 고르실 수 있는 검사
    sub:
    - 종양표지자 혈액검사(AFP·CEA·CA19-9·PSA·CA125·칼시토닌)
    - 자궁경부암·HPV, 유방촬영, 골밀도
    - 동맥경화 검사
    - 생체나이 검사, 유전 질병 위험도 검사, NK세포 활성도 검사
    - 종양표지자는 참고 수치라, 결과는 의료진이 다른 검사와 함께 해석합니다
  notes:
  - 어떤 검사와 진료를 받을지는 의료진이 진찰한 뒤 정합니다. atInc는 맞는 기관을 찾아 예약하고, 그 앞뒤의 상담과 일정을 맡습니다.
