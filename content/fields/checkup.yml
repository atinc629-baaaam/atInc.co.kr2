  anchor: partners
  title: 함께하는 의료기관
  more:
    label: 지역별로 보기
    href: network.html
  items:
  - title: 정밀검진 전문 센터
    text: 등급별 코스와 분야별 정밀검진, 당일 결과 확인이 가능한 검진센터
  - title: 정밀 영상·내시경 장비
    text: MDCT, MRI·MRA, 고해상도 초음파, 고화질 내시경, AI 유방촬영, 골밀도 장비
  - title: 사후관리 연계
    text: 결과에 따라 치료 연계, 만성질환 관리, 경과 관찰, 상급병원 진료까지 이어지는 곳
  - title: 해외 고객 안내
    text: 국제진료센터와 영어·중국어·일본어·몽골어 상담이 가능한 곳
  notes:
  - 기관 이름은 상담에서 고객님께만 따로 말씀드립니다.
- type: steps
  anchor: process
  title: 진행 과정
  items:
  - title: 사전 상담
    text: 건강 목적과 가족력, 지금 앓고 계신 질환과 드시는 약을 확인하고, 이전 검사 자료도 받아 둡니다.
  - title: 검진 계획
    text: 잘 맞는 검진기관과 코스를 비교해 보고, 기본검진에 어떤 선택검사를 더할지 정합니다.
  - title: 사전 준비
    text: 문진표와 안내문을 미리 받아 보시고, 검진 전날 저녁 9시 이후로는 금식해 주세요.
  - title: 검진 당일
    text: 접수하신 뒤 검진복으로 갈아입고 순서대로 검사를 받으시면 됩니다. 종합검진은 구성에 따라 보통 3~4시간 걸립니다.
  - title: 결과 상담
    text: 결과지는 기관에 따라 당일부터 약 2주 사이에 나오고, 자세한 설명은 예약하신 날 의료진에게 직접 들으실 수 있습니다.
  - title: 결과 이후 진료
    text: 이상 소견이 있으면 전문의나 상급 의료기관 상담을 잡아 드립니다. 검진 후 30일 동안은 다음 일정까지 저희가 챙깁니다.
- type: guide
  anchor: guide
  title: 협력 기관이 안내하는 준비와 회복
  timeline:
    title: 검진 하루 흐름
    source: 협력 검진기관 안내 기준
    steps:
    - when: 전날
      title: 저녁 9시 이후 금식
      text: 위내시경은 물을 포함해 8시간 금식합니다
    - when: 도착
      title: 접수와 문진표 확인
      text: 신분증을 보여 주시고 검진복으로 갈아입습니다
    - when: 오전
      title: 기본 검사
      text: 신체계측, 혈액·소변, 흉부 X선, 심전도
    - when: 오전
      title: 초음파·영상
      text: 고르신 부위의 초음파와 CT·MRI
    - when: 오전
      title: 내시경
      text: 수면 내시경은 30분~1시간 쉬었다 귀가합니다
    - when: 당일
      title: 간단한 결과 확인
      text: 대장내시경을 포함하면 보통 3~3.5시간
    - when: 이후
      title: 결과지와 결과 상담
      text: 결과지는 기관에 따라 당일~약 2주, 재검이 필요하면 예약까지
    note: atInc는 전날 금식과 약을 다시 알려 드리고, 결과 상담 날짜까지 잡아 둡니다.
  groups:
  - title: 예약과 당일
    items:
    - 1주 전 예약이 좋고, 대장내시경이 있으면 2주 전에 잡습니다
    - 하반기에는 붐벼서 일찍 잡는 것이 좋고, 화·수·목요일이 비교적 덜 붐빕니다
    - 검진 전에 온라인 문진표를 작성합니다
    - 평일과 토요일 오전에 검진하는 기관이 많고, 정확한 요일은 예약할 때 알려 드립니다
    - 대장내시경을 포함한 종합검진은 보통 3~3.5시간, 국가검진은 2~2.5시간, 선택검진은 2~3.5시간쯤 걸립니다
    - 신분증을 가져오세요
    - 편한 옷차림으로 오시고, X선 촬영이 있어 금속 장신구와 윗속옷은 피하세요. 귀중품은 두고 오세요
  - title: 금식과 약
    items:
    - 전날은 자극적인 음식을 피하고, 금식 중에도 양치는 할 수 있습니다
    - 위내시경은 물을 포함해 8시간 전부터 금식합니다
    - 대장내시경은 3일 전부터 식단을 조절하고, 전날과 당일 장정결제를 나눠 마십니다
    - 대장내시경은 검사 3시간 전부터 물도 마시지 않고, 커피·주스·껌·사탕도 피합니다(맑은 이온음료는 괜찮다고 안내하는 곳이 있습니다)
    - 혈압약은 보통 검진 2시간 전에 적은 물과 함께 드시도록 안내합니다
    - 당뇨약과 인슐린은 금식 중 저혈당이 올 수 있어, 검진 당일 쓸지 반드시 주치의와 정하세요
    - 아스피린·항혈전제는 약 7일 전 중단이 필요할 수 있지만, 임의로 끊지 마시고 주치의와 먼저 상의하세요
    - 당일 혈압이 많이 높으면 일부 검사를 미룰 수 있습니다
  - title: 이럴 땐 미리 알려 주세요
    items:
    - 70세 이상은 수면 내시경 범위가 제한될 수 있습니다
    - 간경화, 만성 폐질환, 협심증·심근경색 같은 질환이 있으면 수면 내시경 전에 꼭 알려 주세요
    - 6개월 안에 수술을 받으셨다면 내시경이 어려울 수 있습니다
    - 치아 교정장치는 MRI 영상에 영향을 줄 수 있어, 의료진이 다른 검사를 권하기도 합니다
    - 임플란트가 있어도 MRI를 받을 수 있는 경우가 많으니, 예약할 때 함께 말씀해 주세요
    - 생리 기간은 피해서 예약합니다
    - 대장 용종을 떼면 비행이 제한될 수 있어 출국 일정을 먼저 확인합니다
    - 수면 내시경 뒤에는 30분~1시간 쉬었다가 귀가하고, 그날은 운전하지 마세요. 보호자와 함께 오시거나 대중교통을 이용하세요
    - 수면 내시경 날에는 콘택트렌즈를 빼고 오세요
  - title: 결과와 그 다음
    items:
    - 간단한 결과는 당일 확인할 수 있습니다
    - 간단한 결과 설명은 전화나 메신저로 받을 수 있는 곳도 있습니다
    - 결과지는 온라인으로도 볼 수 있습니다
    - 결과지는 본인 확인을 거쳐 발급되고, 첫 발급은 본인이 직접 방문해야 하는 곳도 있습니다. 이메일이나 등기로 받을 수 있는 곳도 있습니다
    - 자세한 결과 상담은 의료진과 직접 합니다
    - 결과에 따라 치료 연계, 만성질환 관리, 경과 관찰로 나눠 챙깁니다
    - 같은 기관에서 해마다 받으면 결과를 이어서 비교해 볼 수 있습니다
  - title: 검진 주기
    items:
    - 20~64세는 1~2년마다, 65세 이상은 해마다 받도록 안내합니다
    - 가족력이나 이전 소견이 있으면 주기를 의료진과 다시 정합니다
  notes:
  - 협력 기관들이 고객에게 안내하는 일반적인 내용입니다. 실제 준비와 회복 일정은 예약하신 기관의 담당 의료진이 정하고, atInc는 그 안내를 일정에 넣어 전날 다시 알려 드립니다.
- type: faq_more
  faq_title: 자주 묻는 질문
  faq:
  - q: 검진은 얼마나 걸리나요?
    a: 종합검진은 보통 3~4시간 걸립니다. 받으시는 검사와 그날 검진 인원에 따라 달라질 수 있습니다.
  - q: 병원 이름은 언제 알 수 있나요?
    a: 상담에서 검진 목적과 일정이 정해지면, 비교해 본 검진기관의 이름을 따로 알려 드립니다.
  - q: 몇 곳을 비교해 주나요?
    a: 최대 3곳입니다. 건강 목적과 일정, 관심 있는 분야, 그리고 검진 뒤에 진료가 필요할지까지 생각해서 고릅니다.
  - q: 복용 중인 약은 어떻게 하나요?
    a: 약마다 드시는 시간이나 중단해야 하는지가 다릅니다. 검진 전에 반드시 주치의와 상의해 주세요.
  - q: 결과는 언제, 어떻게 받나요?
    a: 간단한 결과는 당일 확인할 수 있고, 결과지는 기관에 따라 당일부터 약 2주 사이에 나옵니다. 결과 상담은 날짜를 예약해서 받으시면 되고, 해외 고객께는 영문 결과지를 받으실 수 있게 도와 드립니다.
  - q: 검진 후 바로 출국해도 되나요?
    a: 대장 용종을 제거하면 일정 기간 비행기 탑승이 제한될 수 있습니다. 출국 날짜가 정해져 있다면 상담 때 미리 알려 주세요.
  more_title: 더 알아보기
  about:
    title: 건강검진이란
    rows:
    - 건강검진은 뚜렷한 증상이 없을 때 정기적으로 검사해 질병의 징후를 미리 찾는 선별검사입니다.
    - 국가건강검진은 항목과 주기가 법으로 정해져 있습니다. 종합검진은 여기에 나이와 건강 상태에 맞춰 영상검사나 내시경 등을 더한 검진입니다. 정해진 항목 밖의 검사 비용은 본인이 부담합니다.
    - 검진은 병이 있을 가능성을 찾는 검사입니다. 이상 소견이 나오면 추가 검사와 전문의 진료를 거쳐 확인하게 됩니다.
    tables:
    - headers:
      - 분류
      - 어떤 검사를 받게 되는지 미리 알아 두세요
      rows:
      - - 기본 검사
        - 문진, 신체계측, 혈압, 시력·청력, 안압·안저, 혈액·소변, 흉부 X선, 심전도, 폐기능
      - - 영상검사
        - CT(부위 선택), MRI·MRA(뇌·척추 등 부위 선택), 조영 복부 CT
      - - 내시경
        - 위내시경, 대장내시경 (수면 선택)
      - - 초음파
        - 복부, 갑상선, 경동맥, 심장, 유방, 골반(여성)·전립선(남성)
      - - 암 관련
        - 종양표지자 혈액검사, 자궁경부 세포검사·HPV(여성), 선택형 유전자 검사
      - - 심뇌혈관
        - 심장·경동맥 초음파, 동맥경화 측정, 관상동맥 석회화 CT, 뇌혈관 MRA
      - - 여성·남성 특화
        - 유방촬영·유방 초음파·골밀도(여성), 전립선 초음파·PSA(남성)
      - - 정밀 특화
        - 소화기, 심장, 뇌, 폐, 대장, 돌연사 위험 요인 확인 등 분야별 집중 구성
      labels:
      - 분류
      - 주요 검사
  how:
    title: 원리와 방식
    cards:
    - title: 등급별로 나뉜 코스
      text: 협력 검진기관의 코스는 등급이 높아질수록 기본 항목에 초음파, CT, MRI, 내시경이 더해집니다. 상위 코스에서는 CT·MRI 부위와 위 검사 방식을 하나씩 고르시게 됩니다.
    - title: 먼저 살펴보는 다섯 가지
      text: 암 관련 위험과 가족력, 심장·뇌혈관 위험, 대사·체중·혈당, 여성·남성 특화 검사, 수면·스트레스·영양입니다. 이 가운데 어디에 더 무게를 둘지 정한 다음 검사를 짭니다.
  check:
    title: 가기 전에 확인하세요
    items:
    - k: 준비
      v: 검진 전날 저녁 9시 이후에는 금식하셔야 합니다. 대장내시경을 받으신다면 며칠 전부터 식단을 조절하고 장 정결제를 복용하게 됩니다. 드시는 약은 종류마다 먹는 방법이 다르니 주치의와 먼저 상의해 주세요.
    - k: 제한
      v: 나이나 건강 상태에 따라 수면내시경이 제한될 수 있습니다. 최근에 수술을 받으셨거나 치아 교정장치를 하고 계시면 일부 검사가 어려울 수 있습니다. 부인과 검사는 생리 후 7~10일 사이에 받으시는 것이 좋고, 임신 중에는 받을 수 없는 검사가 있습니다.
    - k: 출국 일정
      v: 대장 용종을 제거하면 한동안 비행기 탑승이 제한될 수 있어서, 상담할 때 출국 일정부터 여쭤봅니다.
    principle:
      title: atInc의 원칙
      text: 어떤 검사가 필요한지, 추가 진료를 받아야 하는지는 담당 의료진이 판단합니다. atInc는 가족력과 복용 중인 약, 이전 검사 자료를 미리 모아 의료진에게 전하고, 결과가 나온 뒤의 일정도 챙깁니다.
- type: cband
  title: 어떤 검진이 맞을지, 상담에서 함께 골라 보세요
  text: 건강 목적과 일정을 남겨 주시면, 담당 매니저가 직접 연락드립니다.
  reasons_title: 이럴 때 상담하세요
  reasons:
  - 정밀검진을 처음 받아 보려고 할 때
  - 가족력이 있어서 암이나 심장·뇌혈관을 자세히 보고 싶을 때
  - 검진을 하루 안에 끝내야 할 때
  - 해외에 살아서 한국에 들어오는 날짜에 맞춰 검진받고 싶을 때
  - 지난 검진에서 이상 소견이 나와 다시 확인해 보고 싶을 때
  button: 정밀검진 상담 예약
