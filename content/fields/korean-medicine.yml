  items:
  - title: 한·양방 협진 한방병원
    text: 한의사와 재활의학과·가정의학과 의료진이 함께 치료 계획을 세우고, 주말에도 입원할 수 있는 곳
  - title: 재활 중심 요양병원
    text: 양방 진료과와 한방과가 협진하며 뇌졸중·편마비·파킨슨 같은 노인성 질환의 장기 재활과 입원 회복을 맡는 곳
  - title: 한방 미용 한의원
    text: 매선·미용침·근막 교정 같은 한방 미용과 항노화를 진료하는 곳
  notes:
  - 기관 이름은 상담에서 고객님께만 따로 말씀드립니다.
- type: steps
  anchor: process
  title: 진행 과정
  items:
  - title: 사전 상담
    text: 불편하신 부위와 지금까지 받은 치료, 드시는 약, 한국에 머무실 기간을 여쭤봅니다.
  - title: 한·양방 진찰
    text: 한의사와 양방 의료진이 함께 진찰합니다.
  - title: 치료 계획
    text: 어떤 치료를 몇 번, 얼마 동안 받을지, 입원이 필요한지 상담합니다.
  - title: 치료·재활
    text: 정한 계획대로 외래 또는 입원 치료를 받습니다.
  - title: 경과 확인
    text: 상태 변화를 지켜보면서, 필요하면 치료 계획을 바꿉니다.
  - title: 후속관리
    text: 퇴원하시거나 귀국하신 뒤에도 경과 상담과 다음 진료 날짜를 잡아 드립니다.
- type: guide
  anchor: guide
  title: 협력 기관이 안내하는 준비와 회복
  timeline:
    title: 세 가지 진료 방식
    source: 협력 한방병원·요양병원·한의원 안내 기준
    steps:
    - when: 외래
      title: 통원 치료
      text: 침·약침·추나·도수 치료를 다니며 받습니다
    - when: 입원
      title: 한·양방 협진 재활
      text: 주말에도 입원할 수 있고, 1인실부터 다인실까지 고릅니다
    - when: 장기
      title: 요양병원 재활
      text: 뇌졸중·편마비·파킨슨처럼 회복이 오래 걸릴 때
    - when: 미용
      title: 한방 미용
      text: 피부 측정 뒤 매선·미용침·근막 교정
    - when: 이후
      title: 경과 상담
      text: 다음 진료 날짜와 퇴원·귀국 뒤 상담을 잡아 둡니다
    note: 입원이 필요한지, 얼마나 머물지는 진찰 뒤 정합니다.
  groups:
  - title: 진료 전에
    items:
    - 한약과 함께 드시는 약이나 건강기능식품을 알려 주세요
    - 임신 중이거나 수유 중이시면 꼭 미리 말씀해 주세요
    - 영상·검사 자료가 있으면 가져오세요
    - 봉침은 벌독 알레르기 반응이 생길 수 있어, 벌에 쏘여 심하게 붓거나 숨이 찼던 적이 있으면 꼭 알려 주세요
  - title: 입원과 회복
    items:
    - 입원이 필요한지, 얼마나 머물지는 진찰 뒤 정합니다
    - 외래로 다니며 치료받을 수도 있습니다
    - 회복 속도에 따라 일정은 그때그때 다시 맞춥니다
    - 해외 고객은 영문 진단서를 발급받을 수 있는 곳으로 안내합니다
  - title: 산후 체중 관리 상담
    items:
    - 출산 후 기간, 분만 방식, 수유 여부, 부종과 수면 상태를 먼저 확인합니다
    - 먼저 회복하고, 갑상선·빈혈 같은 검사를 확인한 뒤 감량을 상의합니다
    - 수유 중이면 수유와 근육을 지키며 천천히 줄이는 쪽으로 상의합니다
  notes:
  - 협력 기관들이 고객에게 안내하는 일반적인 내용입니다. 실제 준비와 회복 일정은 예약하신 기관의 담당 의료진이 정하고, atInc는 그 안내를 일정에 넣어 전날 다시 알려 드립니다.
- type: faq_more
  faq_title: 자주 묻는 질문
  faq:
  - q: 한방과 양방 진료를 함께 받을 수 있나요?
    a: 네. 한·양방 협진 병원에서는 한의사와 양방 의료진이 함께 치료 계획을 세웁니다.
  - q: 입원도 가능한가요?
    a: 네. 입원 병동과 1인실이 있는 협력 병원으로 안내해 드립니다.
  - q: 추나는 누가 시술하나요?
    a: 한의사가 직접 합니다. 손이나 신체 일부로 관절·근육·인대를 조정·교정하는 수기요법입니다.
  - q: 약침은 일반 침과 무엇이 다른가요?
    a: 일반 침이 경혈을 자극하는 치료라면, 약침은 경혈에 한약 추출액을 주입해 침 자극과 한약 작용을 함께 활용합니다.
  - q: 한약은 어떤 원료로 조제하나요?
    a: 한의사의 처방에 따라 안전 기준 검사를 거친 의약품용 규격 한약재로 조제합니다.
  - q: 체질 진단은 어떻게 하나요?
    a: 한의사의 문진과 진찰이 기본이며, 사상체질과에서 진료합니다.
  more_title: 더 알아보기
  about:
    title: 한방·웰니스란
    rows:
    - term: 한의 진료
      text: 한의사가 문진과 진찰로 몸 상태를 살핀 뒤, 침이나 뜸, 약침, 추나, 한약 등으로 치료하는 진료입니다.
    - term: 한·양방 협진
      text: 한방과 양방 의료진이 한 환자를 함께 보면서 치료 계획을 세우는 방식입니다. 협력 병원에도 한·양방 협진 센터가 있습니다.
    - term: 회복과 재활
      text: 치료가 끝난 뒤 일상으로 돌아가는 과정도 진료의 일부입니다.
    tables:
    - headers:
      - 구분
      - 내용
      rows:
      - - 침 · 약침 · 봉침
        - 경혈을 자극하는 침 치료와, 경혈에 한약 추출액을 주입해 침 자극과 한약 작용을 함께 활용하는 약침
      - - 뜸
        - 주로 쑥을 이용해 몸의 특정 부위에 온열 자극을 주는 치료
      - - 추나
        - 한의사가 손이나 신체 일부로 관절·근육·인대를 조정·교정하는 수기요법
      - - 한약
        - 한의사의 처방에 따라 의약품용 규격 한약재로 조제
      - - 비수술 재활 치료
        - 도수치료, 체외충격파, 증식치료
      - - 입원 재활
        - 수술 후·교통사고·뇌졸중(중풍) 이후의 입원 회복과 재활
  how:
    title: 원리와 방식
    cards:
    - title: 진찰이 먼저
      text: 한의사의 문진과 진찰로 상태를 확인한 뒤 치료 방법과 기간을 정합니다.
    - title: 체질 진단
      text: 사상체질과에서 진료하고, 체질에 맞춰 치료 방향을 정합니다. 국책연구기관에서는 얼굴과 체형, 설문 등으로 체질 진단을 객관화하려는 연구를 해 왔습니다.
    - title: 한약재 관리
      text: 의약품용 한약재는 중금속·잔류농약 등 안전 기준 검사를 거칩니다.
    - title: 추나 건강보험
      text: 근골격계 질환으로 받는 추나에는 2019년 4월부터 건강보험이 적용되고 있습니다.
  check:
    title: 가기 전에 확인하세요
    items:
    - k: 복용약
      v: 한약과 함께 드시는 약이나 건강기능식품이 있다면 진찰 때 말씀해 주셔야 합니다.
    - k: 임신·수유
      v: 임신 중이거나 수유 중이시면 진찰 전에 꼭 알려 주세요.
    - k: 개인차
      v: 치료 방법과 횟수, 기간은 사람마다 상태에 따라 다릅니다.
    principle:
      title: atInc의 원칙
      text: 치료 방법과 기간은 한의사와 의료진이 진찰한 뒤 고객님과 상의해 정합니다. 회복 속도는 사람마다 달라서, 입원·통원 일정과 경과 진료 날짜는 상태를 보며 그때그때 다시 맞춥니다.
- type: cband
  title: 지금 불편한 곳과 회복 목표부터 말씀해 주세요
  text: 건강 목적과 일정을 남겨 주시면, 담당 매니저가 직접 연락드립니다.
  reasons_title: 이럴 때 상담하세요
  reasons:
  - 허리나 목, 관절 통증을 수술 없이 치료하는 방법을 알아보고 싶을 때
