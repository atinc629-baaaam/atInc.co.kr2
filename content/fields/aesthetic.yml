  how:
    title: 원리와 방식
    cards:
    - title: 리쥬란 · PN 스킨부스터
      points:
      - 식품의약품안전처의 허가를 받은 의료기기이고, 허가받은 사용목적은 '성인 안면부 주름의 일시적 개선'입니다.
      - 주성분은 폴리뉴클레오티드(PN)입니다. 제조사는 연어 생식세포에서 DNA를 추출·정제해 만든 성분이라고 설명합니다.
      - 시술 부위를 소독한 뒤 피부에 천천히 주입하고, 고르게 퍼지도록 마사지합니다. 보통 여러 회차로 나누어 진행하며, 간격과 횟수는 의료진이 피부 상태를 보고 정합니다.
    - title: 울쎄라 · 집속형 초음파 리프팅
      points:
      - 실시간 초음파 영상으로 피부층을 확인하면서, 초음파 에너지를 정해진 깊이(1.5mm·3.0mm·4.5mm)에 모아 진피부터 근막층(SMAS)까지 전달합니다.
      - 시술 시간은 부위에 따라 약 30~90분입니다. 국내 제조사가 안내하는 부위는 눈썹, 턱선(턱 밑·목), 데콜테입니다.
      - 1회 시술한 뒤 경과를 보고, 더 받을지는 그때 상담해서 정합니다.
  check:
    title: 가기 전에 확인하세요
    items:
    - k: 개인차
      v: 결과와 회복 기간은 피부 상태와 시술 범위에 따라 다릅니다.
    - k: 시술 후 반응(리쥬란)
      v: 붉어짐이나 부기, 가려움이 1주 정도 있을 수 있습니다. 시술 후 12시간 동안은 화장을 하지 마시고, 2주 동안은 강한 햇빛과 열, 추위를 피해 주세요.
    - k: 시술 후 반응(울쎄라)
      v: 붉어짐, 부기, 멍, 일시적인 저림이 짧게는 몇 시간, 길게는 몇 주까지 나타날 수 있습니다.
    - k: 시술하지 않는 경우
      v: 시술 부위에 상처나 염증, 심한 여드름이 있을 때는 시술하지 않습니다. 울쎄라는 심박조율기 같은 이식형 기기나 금속 이식물이 있을 때, 리쥬란은 성분 과민증이 있거나 임신·수유 중일 때도 받으실 수 없습니다. 이 밖의 경우는 진찰 때 의료진이 판단합니다.
    - k: 미리 알려주실 것
      v: 복용 중인 약(특히 항응고제)과 최근 필러 시술 이력, 자가면역질환이 있는지 알려 주세요.
    principle:
      title: atInc의 원칙
      text: 시술을 받을지, 어떤 방법으로 할지는 담당 의료진이 직접 진찰한 뒤 고객님과 충분히 상의해서 정합니다. 같은 시술이라도 사람마다 경과가 다르기 때문에, 회복 기간과 경과 확인 날짜는 처음부터 일정에 넣어 둡니다.
- type: cband
  title: 원하시는 변화부터 들려주세요
  text: 건강 목적과 일정을 남겨 주시면, 담당 매니저가 직접 연락드립니다.
  reasons_title: 이럴 때 상담하세요
  reasons:
  - 수술과 비수술 가운데 어느 쪽이 맞는지 전문의 의견을 듣고 싶을 때
  - 이전에 수술한 부위를 다시 상담받고 싶을 때
  - 리프팅·스킨부스터로 탄력과 피부결을 관리하고 싶을 때
  - 체류 기간 안에 상담과 시술, 경과 확인까지 할 수 있는지 먼저 알아보고 싶을 때
  - 탈모나 두피 상태를 전문의에게 확인받고 싶을 때
  button: 성형·피부 상담 예약
