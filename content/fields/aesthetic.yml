  title: 진행 과정
  items:
  - title: 사전 상담
    text: 원하시는 변화와 이전 시술·수술 이력, 복용 중인 약, 체류 일정을 여쭤봅니다.
  - title: 협진 진찰
    text: 피부과 의료진이 피부 상태를, 성형외과 전문의가 윤곽과 비율을 봅니다.
  - title: 계획과 동의
    text: 시술 범위와 예상 회복 기간, 주의사항을 충분히 들으신 뒤 동의서를 작성합니다.
  - title: 시술·수술
    text: 클리닉의 전담 의료진이 직접 진행합니다.
  - title: 회복 안내
    text: 받으신 시술·수술에 맞는 회복 방법을 의료진에게 듣습니다. atInc는 그 안내에 맞춰 경과 확인 날짜와 귀국 일정을 잡아 둡니다. 협력 클리닉이 안내하는 장비 리프팅의 회복 방법은 아래에 정리해 두었습니다.
  - title: 경과 확인
    text: 약속한 날짜에 경과를 확인하고, 귀국하신 뒤에도 경과 상담을 받으실 수 있습니다.
  tone: sand
- type: guide
  anchor: guide
  title: 협력 기관이 안내하는 준비와 회복
  timeline:
    title: 눈 수술 뒤 회복 일정
    source: 협력 클리닉 안내 기준
    steps:
    - when: 당일~3일
      title: 냉찜질
      text: 처음 3일은 냉찜질을 합니다
    - when: 3일 이후
      title: 온찜질
      text: 그 뒤에는 온찜질로 바꿉니다
    - when: 실밥 제거 후
      title: 세안
      text: 평소처럼 세안할 수 있습니다
    - when: 2주
      title: 화장·렌즈
      text: 화장과 렌즈를 다시 시작합니다
    - when: 1개월
      title: 운동·사우나
      text: 격한 운동, 음주, 흡연, 사우나를 다시 시작합니다
    - when: 3~6개월
      title: 남은 부기
      text: 남은 부기가 천천히 빠지는 시기입니다
    note: 수술 종류와 범위에 따라 다릅니다. atInc는 경과 확인 날짜와 귀국 일정을 이 안내에 맞춰 잡습니다.
  groups:
  - title: 눈 수술 뒤
    items:
    - 매몰인지 절개인지에 따라 다르지만, 큰 부기는 보통 1~2주, 남은 부기는 3~6개월에 걸쳐 빠집니다
    - 실밥을 뺀 뒤에 평소처럼 세안합니다
    - 화장과 렌즈는 2주 뒤부터 하세요
    - 격한 운동, 음주, 흡연, 사우나는 한 달쯤 피하세요
    - 처음 3일은 냉찜질, 그 뒤에는 온찜질을 합니다
  - title: 눈밑·코 수술 뒤
    items:
    - 눈밑 수술은 큰 부기가 보통 1주 안팎이면 가라앉습니다
    - 눈화장은 실밥을 뺀 뒤 1~2주, 렌즈는 2~3주 뒤부터 하세요
    - 코 수술은 수술 전후 최소 4주 동안 술과 담배를 피하세요
    - 콧볼 축소(절개) 뒤에는 흉터 관리 일정이 이어집니다
    - 회복 중에는 잠시 좌우가 달라 보일 수 있어, 경과 확인 때 의료진과 함께 봅니다
  - title: 장비 리프팅 뒤
    items:
    - 시술 당일은 물세안만 하고, 화장은 다음 날부터 합니다
    - 음주·흡연과 마사지·각질 제거는 1~2주 피하세요
    - 사우나와 격한 운동은 3~5일 피하세요
    - 자외선 차단과 보습을 꼭 챙기세요
    - 장비 리프팅은 보통 3~6개월 간격으로 이어 가며, 간격은 의료진이 정합니다
    - 실리프팅과 안면거상은 회복 기간과 주의사항이 달라, 수술 전에 따로 안내받습니다
  - title: 스킨부스터
    items:
    - 처음에는 2~4주 간격으로 3회 정도 받는 경우가 많습니다
    - 그 뒤 간격은 3~6개월이 일반적이며, 횟수와 간격은 의료진이 정합니다
    - 주사 자국과 멍은 보통 2~3일이면 가라앉고, 사람에 따라 1주쯤 갈 수 있습니다
  - title: 미리 알려 주세요
    items:
    - 복용 중인 약, 특히 항응고제
    - 오메가3·비타민E·은행잎 제제는 수술 전후 1주 쉬는 것이 좋습니다
    - 최근 필러나 다른 시술 이력
    - 자가면역질환이나 금속 이식물
    - 수술 뒤 심한 통증, 시력 저하, 고열이 있으면 바로 병원에 연락하세요
  notes:
  - 협력 기관들이 고객에게 안내하는 일반적인 내용입니다. 실제 준비와 회복 일정은 예약하신 기관의 담당 의료진이 정하고, atInc는 그 안내를 일정에 넣어 전날 다시 알려 드립니다.
  tone: light
- type: faq_more
  faq_title: 자주 묻는 질문
  faq:
  - q: 수술과 비수술 중 어느 쪽이 맞는지 어떻게 알 수 있나요?
    a: 협진 진찰 때 의료진이 피부 상태와 원하시는 변화를 보고 어떤 방법이 있는지 설명해 드립니다. atInc는 진찰 전에 이전 시술 이력과 바라시는 방향을 미리 여쭤 둡니다.
  - q: 리쥬란은 어떤 시술인가요?
    a: 폴리뉴클레오티드(PN)를 주성분으로 하는 주사형 의료기기로, 국내에서 '성인 안면부 주름의 일시적 개선' 목적으로 허가되었습니다. 몇 번, 어떤 간격으로 받을지는 의료진이 정합니다.
  - q: 울쎄라는 어떤 원리인가요?
    a: 실시간 초음파 영상으로 피부층을 보면서, 정해진 깊이에 초음파 에너지를 모아 전달합니다.
  - q: 시술 후 바로 일상생활이 가능한가요?
    a: 시술마다 다릅니다. 울쎄라는 제조사가 시술 후 바로 일상생활을 할 수 있다고 안내하지만, 붉어짐이나 부기, 멍이 생길 수 있습니다. 수술은 진찰 때 회복 기간을 따로 설명해 드립니다.
  - q: 짧게 머무는 일정에도 가능한가요?
    a: 머무시는 기간을 먼저 알려 주세요. 그 안에 회복과 경과 확인까지 마치기 어려운 수술은 의료진이 다른 방법을 권하거나 다음 방문으로 미루자고 할 수 있습니다. 수술 뒤 비행기를 타도 되는 시점도 의료진에게 확인한 뒤 귀국 일정을 잡습니다.
  - q: 시술 전후 사진을 볼 수 있나요?
    a: 시술 전후 사례는 클리닉 상담에서 직접 안내받으실 수 있습니다.
