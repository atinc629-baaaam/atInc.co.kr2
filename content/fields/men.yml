- type: steps
  anchor: process
  title: 진행 과정
  items:
  - title: 비공개 상담
    text: 방문 목적과 불편한 점, 앓고 계신 질환이나 수술 이력, 복용 중인 약, 갖고 계신 검사 자료를 확인합니다.
  - title: 문진·설문
    text: 증상과 병력을 묻고 표준 설문으로 평가합니다.
  - title: 진찰·검사
    text: 소변·혈액(PSA, 호르몬) 검사, 초음파, 요속·잔뇨 검사를 받습니다.
  - title: 정밀검사(필요할 때만)
    text: PSA 수치에 이상이 있는 등 필요한 경우에 MRI, 조직검사 순으로 진행합니다.
  - title: 결과 설명과 치료 방향
    text: 전문의가 결과를 직접 설명하고, 어떤 단계로 치료할지 상담해 드립니다.
  - title: 후속관리
    text: 경과 진료와 추가 검사, 다음 상담 날짜를 잡아 드립니다.
  tone: sand
- type: guide
  anchor: guide
  title: 협력 기관이 안내하는 준비와 회복
  timeline:
    title: 남성 검사 흐름
    source: 협력 기관 안내 기준
    steps:
    - when: 미리
      title: 복용 약·만성질환 확인
      text: 당뇨·고혈압 기록이 있으면 함께 준비합니다
    - when: 오전
      title: 공복 채혈
      text: 테스토스테론과 PSA, 필요하면 여러 번 측정합니다
    - when: 당일
      title: 소변·요속 검사
      text: 증상 설문과 함께 받습니다
    - when: 당일
      title: 전립선 초음파
      text: 필요한 경우에 받습니다
    - when: 이후
      title: 결과 상담
      text: 필요할 때만 MRI·조직검사로 이어집니다
    note: 정액검사는 3~4일 금욕 뒤에 받고, 생활을 바꾼 뒤의 재검사는 약 두 달 반 뒤에 합니다.
  groups:
  - title: 검사 전에
    items:
    - 복용 중인 약을 미리 알려 주세요
    - 테스토스테론 검사는 보통 오전 공복에 채혈합니다
    - 당뇨·고혈압 같은 만성질환 기록이 있으면 함께 가져오세요
    - 정액검사 전에는 3~4일 금욕하고, 다시 검사할 수 있습니다
  - title: 알아 두실 점
    items:
    - PSA 수치 하나만으로 판단하지 않습니다
    - 국가검진과 국가암검진에는 전립선 검사가 없습니다
    - 치료는 생활습관 교정과 약물에서 시작해 필요하면 시술·수술을 검토합니다
    - 정자가 새로 만들어지는 데 약 두 달 반(64~70일)이 걸려, 생활을 바꾼 뒤의 재검사는 그 뒤에 합니다
  notes:
  - 협력 기관들이 고객에게 안내하는 일반적인 내용입니다. 실제 준비와 회복 일정은 예약하신 기관의 담당 의료진이 정하고, atInc는 그 안내를 일정에 넣어 전날 다시 알려 드립니다.
  tone: light
- type: faq_more
  faq_title: 자주 묻는 질문
  faq:
  - q: 국가건강검진에 전립선 검사가 포함되나요?
    a: 아니요. 국가 일반검진과 암검진에는 전립선 검사가 없습니다. PSA 검사는 개인 종합검진에서 따로 선택해 받는 경우가 많습니다.
  - q: PSA 수치가 높으면 암인가요?
    a: 꼭 그렇지는 않습니다. 전립선비대증이나 염증이 있을 때, 시술이나 사정을 한 뒤에도 수치가 오를 수 있습니다. 그래서 전문의의 해석과 추가 검사를 거쳐 판단합니다.
  - q: 소변줄기가 약하고 밤에 자주 깹니다.
    a: 전립선비대증에서 흔히 나타나는 증상일 수 있습니다. 비뇨의학과에서 증상 설문과 초음파, 요속·잔뇨 검사 등으로 살펴봅니다.
  - q: 남성 갱년기는 어떻게 확인하나요?
    a: 증상을 먼저 확인하고, 오전 공복에 채혈해 혈중 테스토스테론을 여러 번 측정한 뒤 판단합니다.
  - q: 성기능 상담은 어떻게 진행되나요?
    a: 병력과 드시는 약을 확인하고, 설문 평가와 혈액·소변·호르몬 검사를 받게 됩니다. 치료는 덜 침습적인 방법부터 차례로 검토합니다.
  - q: 상담 사실이 회사나 가족에게 알려질까 걱정됩니다.
    a: atInc는 상담에 필요한 정보만 받고, 그 내용은 진료를 맡은 의료진에게만 전합니다.
  more_title: 더 알아보기
  about:
    title: 남성건강이란
    rows:
    - term: 남성건강
      text: 비뇨의학과를 중심으로 전립선·배뇨, 남성 호르몬(갱년기), 성기능, 음낭 질환 등 남성 생식기와 관련된 건강 문제를 다루는 분야입니다.
    - term: 진료과
      text: 주로 비뇨의학과에서 진료하며, 남성 갱년기는 내분비내과·가정의학과에서도 진료합니다.
    - term: 국가검진과의 차이
      text: 국가 일반건강검진과 국가암검진에는 전립선 검사 항목이 없습니다. 그래서 개인 종합검진에서 따로 선택하는 경우가 많습니다.
    tables:
    - headers:
      - 구분
      - 내용
      rows:
      - cells:
        - 남성 검진
        - 기본 검진에 PSA 혈액검사, 전립선 초음파, 소변검사 등을 더해 받으실 수 있습니다.
      - cells:
        - 전립선·배뇨
        - 소변줄기 약화, 잔뇨감, 빈뇨·급박뇨, 야간뇨 같은 배뇨 불편을 평가합니다.
      - cells:
        - 남성 갱년기·호르몬
        - 성욕 저하, 피로, 우울감, 근력 감소 같은 변화를 상담하고 테스토스테론 검사를 받습니다.
      - cells:
        - 남성 기능
        - 발기 기능 등 성기능 고민의 원인을 검사하고 치료 방향을 상담합니다.
      - cells:
        - 수술·시술 후 관리
        - 경과 진료와 추가 검사 날짜를 잡습니다.
  how:
    title: 원리와 방식
    cards:
    - title: PSA 검사
      text: 전립선에서 만들어지는 단백질을 혈액으로 재는 검사입니다. 전립선비대증이나 전립선염이 있을 때, 시술이나 사정을 한 뒤에도 수치가 오를 수 있어서 전문의의 해석이 꼭 필요합니다.
    - title: 초음파·요속·잔뇨 검사
      text: 초음파로 전립선 크기를 재고, 소변 속도와 남은 소변량으로 배뇨 기능을 평가합니다.
    - title: 증상 설문
      text: 전립선 증상과 발기 기능은 국제적으로 쓰이는 표준 설문으로 평가합니다.
    - title: 테스토스테론 검사
      text: 보통 오전에 공복 상태로 채혈하고, 한 번만 보지 않고 여러 번 측정해서 판단합니다.
    - title: 치료 방향
      text: 경과 관찰과 생활습관 교정에서 시작해, 필요하면 약물과 시술·수술 순으로 검토합니다. 덜 침습적인 방법을 먼저 씁니다.
  check:
    title: 가기 전에 확인하세요
    items:
    - k: 수치 해석
      v: PSA 같은 수치 하나만 보고 판단하지 않습니다. 전문의의 해석과 추가 검사가 필요할 수 있습니다.
    - k: 복용약
      v: 복용 중인 약은 검사나 치료 선택에 영향을 줄 수 있으니, 미리 알려 주셔야 합니다.
    - k: 만성질환
      v: 성기능 고민은 당뇨나 고혈압 같은 만성질환과 관련이 깊습니다. 그동안의 진료 기록을 함께 준비해 오시면 상담에 도움이 됩니다.
    principle:
      title: atInc의 원칙
      text: 어떤 검사와 치료가 필요한지는 전문의가 진료하고 검사한 뒤 판단합니다. atInc는 말씀하기 어려운 내용 가운데 진료에 꼭 필요한 부분만 의료진에게 전하고, 진료 뒤의 일정도 조용히 챙겨 드립니다.
- type: cband
  title: 부담 없이 먼저 물어보세요
  text: 건강 목적과 일정을 남겨 주시면, 담당 매니저가 직접 연락드립니다.
  reasons_title: 이럴 때 상담하세요
  reasons:
  - 국가검진에 없는 전립선 검사를 따로 받아보고 싶을 때
  - 소변줄기가 약해지거나 밤에 자주 깰 때
  - 중년 이후 달라진 피로감이나 의욕, 근력이 호르몬과 관련 있는지 알고 싶을 때
  - 성기능 고민을 다른 사람 눈에 띄지 않게 상담하고 싶을 때
  - 이미 받은 비뇨의학과 검사 결과를 다른 전문의에게 다시 확인받고 싶을 때
  button: 남성건강 상담 예약
