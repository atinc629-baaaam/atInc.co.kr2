  title: LONGEVITY 90 — 검진 결과 이후 90일 관리 | atInc
  description: 검사 한 번으로 끝나는 것이 아니라 현재 건강 상태를 확인하고, 의료진과 전문가의 판단을 토대로 90일 동안 실행할 건강관리 일정을 구성하고 점검합니다.
sections:
- type: photo_hero
  sub: 검진 결과를 받은 뒤 90일, 생활 속 실천까지 함께합니다.
  text: 검사 한 번 받고 끝나는 프로그램이 아닙니다. 지금 건강 상태를 먼저 확인하고, 의료진과 전문가의 판단에 따라 90일 관리 일정을 짭니다. 그 뒤로는 30일마다 함께 점검해 드립니다.
