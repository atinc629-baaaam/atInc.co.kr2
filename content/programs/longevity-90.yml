- type: ways
  variant: who
  title: 이런 분께 맞습니다
  items:
  - title: 건강수명·웰에이징에 관심 있는 고객
  - title: 일정이 빠듯한 경영진
  - title: 정기적으로 점검받고 싶은 고객
  tone: light
- type: guide
  fold: false
  title: 포함된 것
  tone: sand
  groups:
  - title: atInc가 맡는 일
    items:
    - 건강 목표와 지금 상태를 미리 여쭙니다
    - 병력과 가족력, 드시는 약을 확인하고 검사 자료를 모읍니다
    - 어떤 검사와 병원 상담을 받으실지 의료진과 정하실 수 있게 준비합니다
    - 의료진의 설명과 권고에 맞춰 진료와 영양, 운동, 수면, 회복 일정을 짭니다
    - 여러 병원과 전문가 예약이 겹치지 않게 맞춥니다
    - 30일, 60일째에 진행 상황을 확인합니다
    - 90일 뒤 병원 재검사 일정을 잡고, 의료진 설명에 맞춰 다음 일정을 정리해 드립니다
  - title: 받으시는 자료
    items:
    - 개인 건강 목표 요약
    - 검사·진료 일정표
    - 90일 실행 캘린더
    - 30·60·90일 점검 기록
    - 다음 단계 제안
  notes:
  - 검사 결과가 무엇을 뜻하는지, 앞으로 어떻게 치료하고 관리할지는 의료진이 판단해 직접 설명해 드립니다. atInc는 그 설명을 기록해 두었다가 90일 일정에 반영합니다. 30일마다 함께 점검하고, 다음 진료 날짜도 잡아 드립니다.
- type: step_cards
  anchor: process
  title: 진행 단계
  tone: light
  items:
  - title: 사전 분석
    en: DISCOVER
    sub:
    - 원하시는 건강 목표를 먼저 듣습니다
    - 그동안 앓으신 병과 가족력, 드시는 약을 확인합니다
    - 수면과 스트레스, 운동, 식습관은 어떤지 살펴봅니다
    - 이전 검사 자료를 받아 둡니다
    - 어느 병원에서 어떤 검사를 받으실지 정합니다
  - title: 병원 검사
    en: CHECK-UP
    sub:
    - 협력 병원에서 암과 심혈관·뇌혈관 질환 관련 검사를 받으십니다
    - 대사건강과 비만, 당뇨 관련 검사를 받으십니다
    - 영양 상태와 비타민, 미네랄 검사를 받으실 수 있습니다
    - 호르몬과 스트레스 관련 검사도 받으실 수 있습니다
    - 신체 조성과 근육량, 근력 측정도 함께 잡아 드립니다
    - 수면과 피로, 인지 기능 검사도 받으실 수 있습니다
    - 필요하면 유전자·면역 관련 검사도 받으실 수 있으며, 받으실 검사는 의료진이 정합니다
  - title: 90일 계획
    en: DESIGN
    sub:
    - 진료와 추가 검사 날짜를 잡습니다
    - 식사와 영양은 어떻게 챙기실지 정합니다
    - 근력과 균형을 위한 운동 계획을 세웁니다
    - 수면과 스트레스 관리도 계획에 들어갑니다
    - 피부·두피 관리와 웰니스 프로그램도 잡아 드립니다
    - 회복과 휴식 프로그램도 일정에 넣어 둡니다
    - 30·60·90일 점검 날짜도 이때 정합니다
  - title: 진행 점검
    en: FOLLOW-UP
    sub:
    - 90일 전체 일정은 atInc가 맡습니다
    - 매달 일정을 미리 알려 드립니다
    - 병원과 전문가 예약은 저희가 잡습니다
    - 검사 결과와 진료 일정을 한곳에 모아 둡니다
    - 30일째와 60일째에 진행 상황을 점검합니다
    - 90일이 지나면 재검사 일정을 잡고, 다음 일정을 정리해 드립니다
