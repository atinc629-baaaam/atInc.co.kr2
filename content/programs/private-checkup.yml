seo:
  title: PRIVATE CHECKUP — 나에게 맞춘 검진 설계 | atInc
  description: 연령, 가족력, 기존 질환, 생활습관과 관심 분야를 먼저 확인한 뒤 적합한 검진기관과 검사 구성을 비교·설계합니다. 정해진 패키지를 그대로 제안하기보다 고객 한 사람의 목적에서 검진의 기준을 시작합니다.
sections:
- type: photo_hero
  sub: 검사 항목은 나이와 가족력에 맞춰 함께 정합니다.
  text: 먼저 나이와 가족력, 앓고 계신 질환, 생활습관, 더 살펴보고 싶은 부분을 여쭙니다. 그다음 검진기관을 비교해 보고 검사 항목을 함께 정하시면 됩니다. 정해진 패키지를 그대로 권하지 않습니다.
  meta:
  - k: 형태
    v: 맞춤형
  - k: 기간
    v: 1일 검진 + 후속관리
  - k: 초점
    v: 검진기관 비교 · 결과 이후 진료
- type: ways
  variant: who
  title: 이런 분께 맞습니다
  items:
  - title: 국내외 VIP·CEO·임원
  - title: 가족력이 있어 정밀검진이 필요한 분
  - title: 한국에 짧게 머무는 동안 검진받고 싶은 해외 고객
  tone: light
- type: guide
  fold: false
  title: 포함된 것
  tone: sand
  groups:
  - title: atInc가 맡는 일
    items:
    - 검진을 받으시려는 이유와 원하시는 점을 먼저 듣습니다
    - 이전 검사 자료와 복용 중인 약을 확인합니다
    - 프리미엄 검진기관 가운데 잘 맞는 곳을 3곳까지 골라 비교해 드립니다
    - 기본검진과 선택검사 항목을 함께 정합니다
    - 병원 예약을 잡고 검사 순서를 짭니다
    - 검진 전에 준비하실 것을 미리 알려 드립니다
    - 결과 상담 날짜도 잡아 둡니다
    - 이상 소견이 있으면 해당 전문의나 상급 의료기관 상담을 잡아 드립니다
    - 검진 후 30일 동안은 이후 일정까지 챙깁니다
  - title: 받으시는 자료
    items:
    - 건강 목적 요약
    - 검진기관·프로그램 비교표
    - 선택검사 제안
    - 전체 일정표
    - 검진 전 준비사항
    - 검진 후 후속 일정표
  notes:
  - 어떤 검사가 필요한지, 추가 진료를 받아야 하는지는 담당 의료진이 판단합니다. atInc는 가족력과 복용 중인 약, 이전 검사 자료를 미리 모아 의료진에게 전하고, 결과가 나온 뒤의 일정도 챙깁니다.
- type: step_cards
  anchor: process
  title: 진행 단계
  tone: light
  items:
  - title: 사전 상담
    sub:
    - 검진 목적과 가족력, 앓고 계신 질환, 드시는 약을 확인합니다
    - 이전 검사 결과와 최근 진료 기록을 받아 둡니다
    - 한국에 계실 수 있는 날짜와 원하시는 동선을 맞춰 봅니다
    - 특히 신경 쓰이는 부분이 있는지 들어 봅니다
  - title: 검진 계획
    sub:
    - 잘 맞는 검진기관과 프로그램을 비교해 드립니다
    - 기본검진에 더할 선택검사를 함께 고릅니다
    - 필요하면 검진 전에 의료진과 미리 상담할 수 있는지 알아봅니다
    - 검진 전 준비할 것과 걸리는 시간을 알려 드립니다
  - title: 검진 예약
    sub:
    - 예약 내용과 검사 순서를 다시 확인합니다
    - 검사 사이에 어디로 이동하고 얼마나 걸리는지 미리 봐 둡니다
    - 검진 전에 준비하실 것을 한 번 더 확인해 드립니다
    - 당일 일정이 바뀌어도 병원 연락은 저희가 합니다
  - title: 결과 이후 진료
    sub:
    - 결과 상담 날짜를 잡아 드립니다
    - 이상 소견이 나오면 해당 분야 전문의나 상급병원 상담을 예약합니다
    - 추가 검사와 재방문 날짜도 잡아 둡니다
    - 검진 후 30일 동안 후속 일정을 챙겨 드립니다
- type: cards
  title: 구성 선택
  tone: sand
  items:
  - title: Essential
    text: 기본 정밀검진을 짜 드리고, 예약과 결과 상담까지 맡습니다
    fit: 이런 분께 · 프리미엄 검진이 처음인 분
  - title: Signature
    text: 암·뇌·심장처럼 관심 있는 분야를 집중해서 살펴봅니다
    fit: 이런 분께 · 40대 이상 CEO·VIP
  - title: Prestige
    text: 전신 검사부터 전문의 상담, 결과가 나온 뒤의 관리까지 함께합니다
    fit: 이런 분께 · 검진 관리를 더 꼼꼼히 받고 싶은 VIP
  notes:
  - 구성별 범위는 상담에서 목적과 일정에 맞춰 정하고, 비용은 상담 뒤 따로 알려 드립니다.
