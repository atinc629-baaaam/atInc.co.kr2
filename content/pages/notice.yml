  crumb: 의료서비스 관련 고지
  title: 의료서비스 관련 고지
- type: doc
  body: |
    atInc는 직접 진단·치료를 제공하는 의료기관이 아니며, 전문 의료기관 연결, 상담·예약 지원, 통역·의전·체류 지원과 사후관리 등 헬스케어 컨시어지 서비스를 제공합니다. 모든 검사, 진단, 처방, 시술 및 치료는 해당 의료기관과 담당 의료진의 전문적 판단에 따라 진행됩니다.

    재생의학 및 면역세포·줄기세포 기반 헬스케어의 적용 가능 여부와 세부 내용은 의료기관별 시행·허가·지정 범위, 고객의 건강 상태와 의료진 상담 결과에 따라 달라질 수 있습니다.

    이 사이트의 의료 정보는 공공기관과 의료기관의 공식 자료를 바탕으로 정리한 일반 정보이며, 개인의 진단이나 치료를 대신하지 않습니다. 소개된 의료기관의 이름은 공개하지 않습니다. 사이트의 사진은 이해를 돕기 위한 참고 이미지이며, atInc나 협력 의료기관의 실제 시설 사진이 아닙니다.
  company: true
  company_title: 회사 정보
