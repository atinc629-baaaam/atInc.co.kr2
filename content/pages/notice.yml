# 의료서비스 관련 고지 (medical-notice.html)
seo:
  title: Medical Notice | atInc
  description: atInc는 의료기관이 아닌 헬스케어 컨시어지입니다. 검사·진단·치료는 협력 의료기관 의료진이 맡습니다. 회사 정보와 의료서비스 관련 고지입니다.
