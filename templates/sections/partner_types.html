{# 함께 일하는 곳의 종류 #}
{% from 'macros.html' import sh %}
<section class="sec{% if s.tone == 'sand' %} sec--sand{% endif %}"><div class="wrap">{{ sh(s.title, s.lead, P) }}
<ul class="ptypes">{% for t in s['items'] %}{% set Q = P ~ '.items.' ~ loop.index0 %}<li{{ IT(Q) }}><h3{{ A(Q ~ '.title') }}>{{ t.title }}</h3><p class="body"{{ A(Q ~ '.text') }}>{{ t.text }}</p><ul>{% for x in t.examples %}{% set R = Q ~ '.examples.' ~ loop.index0 %}<li{{ IT(R) }}{{ A(R) }}>{{ x }}</li>{% endfor %}</ul></li>{% endfor %}</ul></div></section>
