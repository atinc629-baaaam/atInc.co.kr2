{% from 'macros.html' import form_link, contact_links %}
<section class="sec cband" id="contact"><div class="wrap cband__grid"><div style="display: grid; gap: 22px"><h2 class="h1"{{ A(P ~ '.title') }}>{{ s.title }}</h2><p class="lead"{{ A(P ~ '.text') }}>{{ s.text }}</p></div>
<div class="cband__side"><a class="btn btn--light btn--wide" href="{{ S.contact.partner_mail }}"{{ A(P ~ '.mail_button') }}>{{ s.mail_button }}</a>{{ form_link(s.form_button, s.form_label, 'btn btn--ghost-light btn--wide', None, P ~ '.form_button') }}
{{ contact_links('contacts', intl=True) }}</div></div></section>
