{# 홈 첫 화면 아래 바로가기 메뉴 #}
<nav class="qmenu" aria-label="바로가기"><div class="wrap"><ul class="qmenu__list">
{% for q in s['items'] %}{% set Q = P ~ '.items.' ~ loop.index0 %}<li{{ IT(Q) }}><a href="{{ q.href }}">{{ ic2(q.icon) }}<span{{ A(Q ~ '.label') }}>{{ q.label }}</span></a></li>{% endfor %}
</ul></div></nav>
