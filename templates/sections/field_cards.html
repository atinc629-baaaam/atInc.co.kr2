{# 진료 분야 목록 카드 (진료 분야 목록에서 자동) #}
<section class="sec" style="padding-top: clamp(48px, 5vw, 72px)"><div class="wrap"><div class="grid3">
{% for f in fields %}<a class="mcard mcard--pic" href="{{ f.page }}"><figure class="mcard__pic">{{ pic(f.photo, '', '(max-width: 600px) 100vw, (max-width: 1100px) 50vw, 33vw', (480, 720, 1080)) }}</figure><div class="mcard__txt"><span class="mcard__no">{{ '%02d' % loop.index }}</span><p class="mcard__en">{{ f.en }}</p><h2 class="mcard__t">{{ f.ko }}</h2><p class="body" style="font-size: 14.5px">{{ f.index_text }}</p><span class="link">{{ s.link_label }}</span></div></a>{% endfor %}
</div></div></section>
