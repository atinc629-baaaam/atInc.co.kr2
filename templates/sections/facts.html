{# 어두운 바탕의 숫자 카드 (출처 링크 포함) #}
<section class="sec facts-dark"{% if s.anchor %} id="{{ s.anchor }}"{% endif %}><div class="wrap"><div class="idx__head"><h2 class="disp-2">{{ s.title }}</h2><p class="lead">{{ s.lead }}</p></div>
<div class="fgrid fgrid--{{ s['items']|length }}">{% for f in s['items'] %}<article class="fact"><p class="fact__fig{% if f.word %} fact__fig--word{% endif %}">{{ f.figure }}<small>{{ f.unit }}</small></p><p class="fact__txt">{{ f.text }}</p><a class="fact__src" href="{{ f.source_href }}" target="_blank" rel="noopener">{{ f.source }}{{ ic('out') }}</a></article>{% endfor %}</div></div></section>
