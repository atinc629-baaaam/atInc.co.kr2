<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><script>document.documentElement.classList.add('js')</script>
<title>{{ title }}</title><meta name="description" content="{{ desc }}">
<link rel="canonical" href="{{ url }}"><meta name="theme-color" content="{{ S.site.theme_color }}">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="icon" href="assets/favicon-192.png" sizes="192x192" type="image/png"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta property="og:site_name" content="{{ S.site.name }}"><meta property="og:locale" content="ko_KR">
<meta property="og:title" content="{{ title }}"><meta property="og:description" content="{{ desc }}"><meta property="og:type" content="website">
<meta property="og:url" content="{{ url }}"><meta property="og:image" content="{{ S.site.url }}assets/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="stylesheet" href="{{ PRET }}">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="assets/site.css">
